sourceSets {
    autotest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        voxy { sourceSet sourceSets.main }
        voxy_autotest { sourceSet sourceSets.autotest }
    }
    runs {
        autotest {
            client()
            name = "Voxy Autotest"
            source sourceSets.autotest
            runDir "run-autotest-1211"
            programArgs "--width", "1280", "--height", "720"
            vmArgs(*autotestJvmArgs())
        }
    }
}

//Shared by the dev autotest run and the production autotest run
def autotestJvmArgs() {
    def args = ["-Dvoxy.autotest=true",
                "-Dvoxy.autotest.scenario=${project.findProperty('voxy.autotest.scenario') ?: 'smoke'}".toString(),
                "-Dvoxy.autotest.out=${project.findProperty('voxy.autotest.out') ?: 'autotest-out'}".toString(),
                "-Dvoxy.autotest.world=${project.findProperty('voxy.autotest.world') ?: 'voxy-autotest'}".toString(),
                "-Dvoxy.autotest.seed=${project.findProperty('voxy.autotest.seed') ?: '8675309'}".toString(),
                "-Dsodium.checks.issue2561=false"]
    //Extra jvm arguments for experiments, e.g. -Pvoxy.autotest.jvmArgs="-Dvoxy.debug.noChunkBounds=true"
    def extraJvmArgs = project.findProperty('voxy.autotest.jvmArgs')
    if (extraJvmArgs) {
        args.addAll(extraJvmArgs.toString().trim().split(/\s+/))
    }
    return args
}

//Production autotest: the remapped release jar and the original (intermediary) mod jars in a production launch,
// catches remapping and mixin problems the dev run cannot see
configurations {
    prodMods { transitive = false }
}

dependencies {
    prodMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    prodMods "maven.modrinth:sodium:mc1.21.11-0.8.12-fabric"
    prodMods "maven.modrinth:iris:1.10.7+1.21.11-fabric"
    prodMods "maven.modrinth:chunky:1.4.54-fabric"
}

def autotestJar = tasks.register('autotestJar', Jar) {
    from sourceSets.autotest.output
    archiveClassifier = 'autotest-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}

def remapAutotestJar = tasks.register('remapAutotestJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = autotestJar.flatMap { it.archiveFile }
    archiveClassifier = 'autotest'
    destinationDirectory = layout.buildDirectory.dir('autotestlibs')
    addNestedDependencies = false
}

tasks.register('runProdAutotest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(tasks.remapJar, remapAutotestJar, configurations.prodMods)
    runDir = file('run-autotest-1211')
    jvmArgs.addAll(autotestJvmArgs())
    programArgs.addAll("--width", "1280", "--height", "720")
    //-Pvoxy.autotest.java=21 runs on the java version the vanilla 1.21.11 launcher uses
    def javaVersion = project.findProperty('voxy.autotest.java')
    if (javaVersion) {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(javaVersion.toString().toInteger()) }
    }
}
