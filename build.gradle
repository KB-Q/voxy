plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}


def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time)
    filesMatching("fabric.mod.json") {
        expand "version": version, "commit": hash, "buildtime": time
    }
}

loom {
    accessWidenerPath = file("src/main/resources/voxy.accesswidener")
    runs {
        client {
            vmArgs "-Dsodium.checks.issue2561=false"
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation "maven.modrinth:sodium:${project.sodium_version}"
    modImplementation "maven.modrinth:iris:${project.iris_version}"
    //iris needs these at runtime in the dev environment
    modRuntimeOnly "io.github.douira:glsl-transformer:2.0.1"
    modRuntimeOnly "org.anarres:jcpp:1.4.14"
    modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"
    modImplementation "maven.modrinth:chunky:${project.chunky_version}"

    //Compile only compat
    modCompileOnly "maven.modrinth:lithium:${project.lithium_version}"
    modCompileOnly "maven.modrinth:flashback:${project.flashback_version}"
    modCompileOnly "maven.modrinth:vivecraft:${project.vivecraft_version}"
}


def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

java {
    def javaVersion = JavaVersion.toVersion(21)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
    }
    java21 {
        java.srcDirs = ['src/java21/java']
        compileClasspath += sourceSets.main.output
    }
}

tasks.register('compileJava21', JavaCompile) {
    source = sourceSets.java21.java
    classpath = sourceSets.java21.compileClasspath
    destinationDirectory = layout.buildDirectory.dir("classes/java21")

    options.release = 21
}

tasks.jar {
    dependsOn(tasks.compileJava21)

    from(tasks.compileJava21.destinationDirectory) {
        into("META-INF/versions/21")
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    manifest {
        attributes(
                "Multi-Release": "true"
        )
    }

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}


tasks.register('makeExcludedRocksDB', Zip) {
    archiveExtension.set("jar")
    entryCompression = ZipEntryCompression.STORED
    destinationDirectory.set temporaryDir

    dependsOn configurations.includeInternal

    def files = configurations.includeInternal.incoming.getArtifacts().getArtifactFiles().filter {
        it.name.startsWith('rocksdb')
    }

    from {->zipTree(files.first())}
    archiveFileName.set(providers.provider{files.first().name})

    //Keep the macOS libraries (the default storage backend is rocksdb), still drop the more exotic targets
    exclude {
        def file = it.name
        if (file.endsWith(".jnilib")) {
            return !(file.contains("osx-arm64") || file.contains("osx-x86_64"))
        }
        if (!file.endsWith(".so")) {
            return false
        }
        return ["osx", "linux32", "musl", "s390x", "riscv64", "ppc64le", "aarch64"].any(file::contains)
    }
}

processIncludeJars {
    outputs.cacheIf {true}

    dependsOn makeExcludedRocksDB
    jars = jars.filter {!it.name.startsWith('rocksdb')}
    jars.from(makeExcludedRocksDB)
}

remapJar {
    dependsOn(tasks.compileJava21)

    from(tasks.compileJava21.destinationDirectory) {
        into("META-INF/versions/21")
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    doFirst {
        delete fileTree(getDestinationDirectory().get())
    }

    if (!isInGHA) {
        def hash = gitCommitHash();
        if (!hash.equals("<UnknownCommit>")) {
            archiveClassifier.set(hash.substring(0,7));
        }
    }
}

//Must match the lwjgl version minecraft 1.20.1 ships
project.ext.lwjglVersion = "3.3.1"

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    include(implementation "org.lwjgl:lwjgl-lmdb")
    include(implementation "org.lwjgl:lwjgl-zstd")
    for (String natives : ["natives-windows", "natives-linux", "natives-macos", "natives-macos-arm64"]) {
        include(runtimeOnly "org.lwjgl:lwjgl-lmdb:$lwjglVersion:$natives")
        include(runtimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:$natives")
    }

    include(implementation 'redis.clients:jedis:5.1.0')
    include(implementation('org.rocksdb:rocksdbjni:10.2.1'))
    include(implementation 'org.apache.commons:commons-pool2:2.12.0')
    include(implementation 'org.lz4:lz4-java:1.8.0')
    include(implementation('org.tukaani:xz:1.10'))

    if (!isInGHA) {
        minecraftRuntimeLibraries('org.xerial:sqlite-jdbc:3.49.1.0')
    }
}
